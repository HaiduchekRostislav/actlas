<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, scripts)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">Actlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="header">
  <div class="container">
    <div class="header__inner">
      <a href="/" class="logo">
        ACTLAS
        <span class="logo__sub">ACTOR ATLAS</span>
      </a>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <div th:replace="${content}"><!-- content --></div>
  </div>
</main>

<!-- app.js завантажується першим -->
<script th:src="@{/js/app.js}"></script>
<!-- потім сторінковий скрипт -->
<div th:replace="${scripts}"><!-- page scripts --></div>

</body>
</html>
